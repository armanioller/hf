<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Halftone Forge Pro Studio</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#131316}
    #hfAppFrame{display:block;width:100%;height:100%;border:0;background:#131316}
    .hf-cloud-bar{position:fixed;z-index:2147483000;right:14px;bottom:14px;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(22,22,27,.94);box-shadow:0 14px 42px rgba(0,0,0,.42);backdrop-filter:blur(12px)}
    .hf-cloud-btn{border:1px solid rgba(255,255,255,.13);border-radius:8px;background:#292930;color:#f2f2f5;padding:8px 10px;font:600 11px/1 system-ui;cursor:pointer}.hf-cloud-btn:hover{border-color:#ff6a3d}.hf-cloud-btn:disabled{opacity:.45;cursor:not-allowed}.hf-cloud-btn.primary{background:#ff4713;border-color:#ff4713;color:#1a0904}
    .hf-cloud-status{display:flex;align-items:center;gap:7px;max-width:270px;padding:0 7px;color:#aaaab4;font:500 10px/1.25 system-ui}.hf-cloud-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#6d6d76;flex:none}.hf-cloud-status.ok:before{background:#2ed6a1}.hf-cloud-status.working:before{background:#ffb347;box-shadow:0 0 0 3px rgba(255,179,71,.15)}.hf-cloud-status.error:before{background:#ff5d5d}.hf-cloud-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:760px){.hf-cloud-bar{left:8px;right:8px;bottom:8px;justify-content:center;flex-wrap:wrap}.hf-cloud-status{order:2;width:100%;max-width:none;justify-content:center}.hf-cloud-btn{padding:8px;font-size:10px}}
  </style>
</head>
<body>
  <iframe id="hfAppFrame" src="./app.html?v=73-cloud-public" title="Halftone Forge" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <div class="hf-cloud-bar" aria-label="Armazenamento em nuvem">
    <div class="hf-cloud-status idle" id="hfCloudStatus"><span id="hfCloudStatusText">Conectando à nuvem…</span></div>
    <button class="hf-cloud-btn primary" id="hfCloudSync" type="button" disabled>Salvar agora</button>
    <button class="hf-cloud-btn" id="hfCloudRestore" type="button" disabled>Restaurar</button>
  </div>

  <script src="./gallery-memory-bridge.js?v=1"></script>
  <script src="./cloud-public-sync.js?v=1"></script>
</body>
</html>
