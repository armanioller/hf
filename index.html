<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Halftone Forge Pro Studio</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#131316}
    body{display:flex;flex-direction:column}
    #hfAppFrame{display:block;width:100%;flex:1 1 auto;min-height:0;border:0;background:#131316}
    .hf-cloud-bar{position:relative;z-index:10;flex:0 0 46px;display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:6px 10px;border-top:1px solid rgba(255,255,255,.12);background:#17171c;box-shadow:0 -6px 18px rgba(0,0,0,.28)}
    .hf-cloud-btn{border:1px solid rgba(255,255,255,.13);border-radius:8px;background:#292930;color:#f2f2f5;padding:8px 10px;font:600 11px/1 system-ui;cursor:pointer;white-space:nowrap}.hf-cloud-btn:hover{border-color:#ff6a3d}.hf-cloud-btn:disabled{opacity:.45;cursor:not-allowed}.hf-cloud-btn.primary{background:#ff4713;border-color:#ff4713;color:#1a0904}
    .hf-cloud-status{display:flex;align-items:center;gap:7px;max-width:320px;padding:0 7px;color:#aaaab4;font:500 10px/1.25 system-ui}.hf-cloud-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#6d6d76;flex:none}.hf-cloud-status.ok:before{background:#2ed6a1}.hf-cloud-status.working:before{background:#ffb347;box-shadow:0 0 0 3px rgba(255,179,71,.15)}.hf-cloud-status.error:before{background:#ff5d5d}.hf-cloud-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:760px){.hf-cloud-bar{flex-basis:44px;padding:5px 7px;gap:5px}.hf-cloud-status{flex:1;min-width:0;max-width:none;padding:0 4px}.hf-cloud-btn{padding:7px 8px;font-size:10px}}
  </style>
</head>
<body>
  <iframe id="hfAppFrame" src="./app.html?v=74-cloud-footer" title="Halftone Forge" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <div class="hf-cloud-bar" aria-label="Armazenamento em nuvem">
    <div class="hf-cloud-status idle" id="hfCloudStatus"><span id="hfCloudStatusText">Conectando à nuvem…</span></div>
    <button class="hf-cloud-btn primary" id="hfCloudSync" type="button" disabled>Salvar agora</button>
    <button class="hf-cloud-btn" id="hfCloudRestore" type="button" disabled>Restaurar</button>
  </div>

  <script src="./gallery-memory-bridge.js?v=1"></script>
  <script src="./cloud-public-sync.js?v=3"></script>
</body>
</html>
